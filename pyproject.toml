[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "checkwarranty-glpi-sync"
version = "1.0.1"
authors = [
  { name = "CheckWarranty Team", email = "support@checkwarranty.info" },
]
description = "Sync hardware warranty expiration dates and specs into GLPI ITAM via CheckWarranty API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
  "python-dotenv>=1.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Hardware",
]

[project.scripts]
checkwarranty-glpi-sync = "checkwarranty_glpi_sync:main"

[tool.setuptools]
packages = ["checkwarranty_glpi_sync"]

[project.urls]
Homepage = "https://github.com/checkwarranty/glpi-warranty-sync"
Issues = "https://github.com/checkwarranty/glpi-warranty-sync/issues"
